defaults:
  - model: transformer
  - dataset: translation
  - data: de_en
  - optimizer: adam
  - scheduler: constant
  - trainer: default
  - decoding: beam_search
  - evaluation: bleu
  - plotting: default
  - output: default
  - _self_

seed: 42
device: auto

hydra:
  run:
    dir: ${output.dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${output.dir}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
